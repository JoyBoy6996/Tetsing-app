name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK Package and Components
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -n 1)
          echo "Using AAPT at: $AAPT"
          echo "=== APK Badging ==="
          "$AAPT" dump badging "$APK_PATH"
          echo "=== Manifest Components ==="
          "$AAPT" dump xmltree "$APK_PATH" AndroidManifest.xml | grep -E "(E: activity|E: service|A: android:name)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
