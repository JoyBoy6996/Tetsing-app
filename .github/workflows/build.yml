name: Build forcehz APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK Package and Components
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -n 1)
          echo "Using AAPT at: $AAPT"
          echo "=== APK Badging ==="
          "$AAPT" dump badging "$APK_PATH"
          echo "=== Manifest Components ==="
          "$AAPT" dump xmltree "$APK_PATH" AndroidManifest.xml | grep -E "(E: activity|E: service|A: android:name)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forcehz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
